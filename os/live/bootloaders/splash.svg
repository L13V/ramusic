<?xml version="1.0" encoding="UTF-8"?>
<!-- Boot-menu background. live-build renders this to PNG (800x600 for GRUB,
     640x480 for isolinux) and substitutes the @TOKENS@ at build time. The GRUB
     theme draws its menu over the lower half, so everything here stays up top. -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#000000"/>

  <!-- Accent bar -->
  <rect x="0" y="0" width="800" height="4" fill="#00aaff"/>

  <text x="400" y="150" text-anchor="middle"
        font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="72" font-weight="bold"
        fill="#00aaff" letter-spacing="6">RAMTECH</text>
  <text x="400" y="196" text-anchor="middle"
        font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="26"
        fill="#e6edf3" letter-spacing="12">OS</text>

  <line x1="280" y1="228" x2="520" y2="228" stroke="#26323f" stroke-width="2"/>

  <text x="400" y="262" text-anchor="middle"
        font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="18" fill="#92a4b5">
    Spotify listening-party dashboard
  </text>
  <text x="400" y="292" text-anchor="middle"
        font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="14" fill="#5c6f80">
    @DISTRIBUTION@ @ARCHITECTURE@ · built @DATE@
  </text>
</svg>
