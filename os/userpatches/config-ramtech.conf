# RAMTECH OS — Armbian build configuration for Orange Pi 5 (RK3588S).
# Used as:  ./compile.sh ramtech        (this file is bash-sourced by the build)
#
# BRANCH=current (mainline) is deliberate: the vendor 6.1 BSP kernel ships an
# in-tree mali_kbase that blocks the panthor/panfrost GPU driver Chromium needs.

BOARD="orangepi5"
BRANCH="current"
RELEASE="trixie"
BUILD_MINIMAL="yes"
BUILD_DESKTOP="no"
KERNEL_CONFIGURE="no"

# Minimal images default to systemd-networkd; the admin web UI drives nmcli.
NETWORKING_STACK="network-manager"

# Branding: rebrands /etc/armbian-release, the motd header and the image name.
VENDOR="RAMTECH"
VENDORURL="https://github.com/OWNER/REPO"
VENDORCOLOR="0;170;255"

COMPRESS_OUTPUTIMAGE="sha,xz"
