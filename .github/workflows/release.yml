name: Release

# Tag a version (v1.2.3) → builds the OTA tarball and attaches it to a GitHub
# Release. Devices (and the image builder) download ramtech-app-<tag>.tar.gz.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install production dependencies
        run: |
          npm ci --omit=dev --prefix app
          npm ci --omit=dev --prefix admin

      - name: Lint shell scripts
        run: |
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck -S warning os/overlay/bin/*.sh os/*.sh app/deploy/kiosk.sh
          shellcheck -S warning -s bash os/live/hooks/normal/*.hook.chroot

      - name: Build tarball
        run: |
          TAG="${GITHUB_REF_NAME}"
          STAGE="$(mktemp -d)"
          cp -r app admin "$STAGE/"
          mkdir -p "$STAGE/bin"
          cp os/overlay/bin/*.sh "$STAGE/bin/"
          chmod +x "$STAGE/bin/"*.sh "$STAGE/app/deploy/"*.sh
          printf '%s\n' "$TAG" > "$STAGE/VERSION"
          # Never ship local state or secrets.
          rm -rf "$STAGE/app/.data" "$STAGE/app/.env"
          tar -czf "ramtech-app-$TAG.tar.gz" -C "$STAGE" app admin bin VERSION
          tar -tzf "ramtech-app-$TAG.tar.gz" | head -5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ramtech-app-*.tar.gz
          generate_release_notes: true

  # The OS image bakes in the app tarball the job above just published, so it
  # has to run second. The imager's "Latest RAMTECH OS" option reads this asset.
  os-image:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Build the live image
        env:
          RAMTECH_VERSION: ${{ github.ref_name }}
        run: |
          docker build -t ramtech-os-builder os
          docker run --rm --privileged \
            -v "$PWD:/src" -e RAMTECH_VERSION -e PERSIST_MB=4096 \
            ramtech-os-builder bash /src/os/build-in-container.sh
          ls -lh os/out

      - name: Attach the image to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            os/out/ramtech-os-*.img.gz
            os/out/ramtech-os-*.img.gz.sha256

      - name: Keep the build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-build-log
          path: os/out/build.log
